          description: Malformed JSON
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: Request too large
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Invalid question or history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
