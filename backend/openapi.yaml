  /checkout:
    post:
      tags:
        - Checkout
      summary: Reserve inventory and create a hosted Maya checkout
      description: The checkout URL is null until Maya returns a hosted link. Retry the same network attempt
        with the same key.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          example: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                couponCode:
                  default: ""
                  anyOf:
                    - type: string
                      pattern: ^[A-Z0-9-]{3,24}$
                    - type: string
                      const: ""
                shipping:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 100
                    phone:
                      type: string
                      pattern: ^(?:\+63|0)9\d{9}$
                    address:
                      type: string
                      minLength: 8
                      maxLength: 180
                    city:
                      type: string
                      minLength: 2
                      maxLength: 100
                    postalCode:
                      type: string
                      pattern: ^\d{4}$
                  required:
                    - name
                    - phone
                    - address
                    - city
                    - postalCode
              required:
                - shipping
            example:
              shipping:
                name: Jamie Cruz
                phone: "09171234567"
                address: 123 Quezon Avenue
                city: Iligan City
                postalCode: "9200"
              couponCode: CARRY10
      responses:
        "200":
          description: Existing order returned for the same idempotency key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
