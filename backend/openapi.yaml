components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ShoppingReply:
      type: object
      required: [answer, products, aiAssisted]
      properties:
        answer: {type: string}
        products:
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/Product"}
        aiAssisted: {type: boolean}
    InventoryReport:
      type: object
      required: [generatedAt, policy, summary, aiAssisted, overview, recommendations]
      properties:
        generatedAt: {type: string, format: date-time}
        aiAssisted: {type: boolean}
        overview: {type: string}
        policy:
          type: object
          required: [salesDays, targetDays, lowStockThreshold, minimumTarget]
          properties:
            salesDays: {type: integer, const: 30}
            targetDays: {type: integer, const: 14}
            lowStockThreshold: {type: integer, const: 4}
            minimumTarget: {type: integer, const: 5}
        summary:
          type: object
          required: [productsAnalyzed, unitsSold, lowStock, reorderCount, attentionCount]
          properties:
            productsAnalyzed: {type: integer, minimum: 0}
            unitsSold: {type: integer, minimum: 0}
            lowStock: {type: integer, minimum: 0}
            reorderCount: {type: integer, minimum: 0}
            attentionCount: {type: integer, minimum: 0}
        recommendations:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, name, category, stock, units_sold, target, suggestedReorder, action, note]
            properties:
              id: {type: string}
              name: {type: string}
              category: {type: string}
              stock: {type: integer, minimum: 0}
              units_sold: {type: integer, minimum: 0}
              target: {type: integer, minimum: 0}
              suggestedReorder: {type: integer, minimum: 0}
              action: {type: string, enum: [restock, review]}
              note: {type: string}
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - customer
            - admin
      required:
        - id
        - name
        - email
        - role
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        image:
          type: string
        background:
          type: string
        price_cents:
          type: integer
        stock:
          type: integer
        laptop_inches:
          anyOf:
            - type: number
            - type: "null"
        monogram_cents:
          anyOf:
            - type: integer
            - type: "null"
        active:
          type: boolean
        category:
          type: string
        category_id:
          type: string
      required:
        - id
        - name
        - description
        - color
        - image
        - background
        - price_cents
        - stock
        - laptop_inches
        - monogram_cents
        - active
        - category
        - category_id
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - active
    CartLine:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            quantity:
              type: integer
            monogram:
              type: string
            available:
              type: boolean
            unit_cents:
              type: integer
            line_cents:
              type: integer
          required:
            - quantity
            - monogram
            - available
            - unit_cents
            - line_cents
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        subtotal_cents:
          type: integer
        currency:
          const: PHP
      required:
        - items
        - subtotal_cents
        - currency
    Coupon:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          enum:
            - percent
            - fixed
        value:
          type: integer
          minimum: 1
          maximum: 10000000
        minimum_cents:
          type: integer
          minimum: 0
          maximum: 10000000
        expires_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        max_uses:
          type: integer
          minimum: 1
          maximum: 100000
        max_per_user:
          type: integer
          minimum: 1
          maximum: 100000
        active:
          default: true
          type: boolean
      required:
        - code
        - kind
        - value
        - minimum_cents
        - expires_at
        - max_uses
        - max_per_user
        - active
    MoneySummary:
      type: object
      properties:
        subtotal_cents:
          type: integer
        discount_cents:
          type: integer
        shipping_cents:
          type: integer
        total_cents:
          type: integer
        currency:
          const: PHP
      required:
        - subtotal_cents
        - discount_cents
        - shipping_cents
        - total_cents
        - currency
    Quote:
      allOf:
        - $ref: "#/components/schemas/MoneySummary"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CartLine"
          required:
            - items
    OrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        user_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          enum:
            - pending_payment
            - paid
            - processing
            - shipped
            - delivered
            - cancelled
            - expired
            - failed
        total_cents:
          type: integer
        currency:
          const: PHP
        created_at:
          type: string
          format: date-time
        payment_flag:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required:
        - id
        - user_id
        - status
        - total_cents
        - currency
        - created_at
        - payment_flag
    OrderLine:
      type: object
      properties:
        product_id:
          type: string
        name:
          type: string
        image:
          type: string
        quantity:
          type: integer
        monogram:
          type: string
        unit_cents:
          type: integer
        line_cents:
          type: integer
      required:
        - product_id
        - name
        - image
        - quantity
        - monogram
        - unit_cents
        - line_cents
    HistoryLine:
      type: object
      properties:
        status:
          enum:
            - pending_payment
            - paid
            - processing
            - shipped
            - delivered
            - cancelled
            - expired
            - failed
        actor:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - status
        - actor
        - created_at
    Order:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - $ref: "#/components/schemas/MoneySummary"
        - type: object
          properties:
            shipping:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  pattern: ^(?:\+63|0)9\d{9}$
                address:
                  type: string
                  minLength: 8
                  maxLength: 180
                city:
                  type: string
                  minLength: 2
                  maxLength: 100
                postalCode:
                  type: string
                  pattern: ^\d{4}$
              required:
                - name
                - phone
                - address
                - city
                - postalCode
            coupon_code:
              anyOf:
                - type: string
                - type: "null"
            gateway_id:
              anyOf:
                - type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                - type: "null"
            checkout_url:
              anyOf:
                - type: string
                  format: uri
                - type: "null"
            expires_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderLine"
            history:
              type: array
              items:
                $ref: "#/components/schemas/HistoryLine"
            canRetry:
              type: boolean
          required:
            - shipping
            - coupon_code
            - gateway_id
            - checkout_url
            - expires_at
            - updated_at
            - items
            - history
            - canRetry
    StockChange:
      type: object
      properties:
        id:
          type:
            - integer
            - string
        product_id:
          type: string
        old_stock:
          type: integer
        new_stock:
          type: integer
        reason:
          type: string
        actor:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - product_id
        - old_stock
        - new_stock
        - reason
        - actor
        - created_at
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - page
        - limit
        - total
    Error:
      type: object
      properties:
        success:
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
            - code
            - message
        requestId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - success
        - error
        - requestId
