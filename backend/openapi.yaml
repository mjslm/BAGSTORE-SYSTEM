openapi: 3.1.0
info:
  title: Carry & Co. REST API
  version: 1.0.0
  description: All prices use integer PHP centavos. Customer orders are private. The API owns totals,
    inventory and payment verification.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      tags:
        - System
      summary: Check API and database availability
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                    required:
                      - status
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  status: ok
                meta: {}
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Create a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
              required:
                - email
                - password
                - name
            example:
              name: Jamie Cruz
              email: new@example.com
              password: Example!2026
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Session"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  user:
                    id: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
                    name: Jamie Cruz
                    email: jamie@carry.test
                    role: customer
                  token: JWT returned by sign-in
                meta: {}
        "400":
          description: The request body must be valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: MALFORMED_JSON
                  message: The request body must be valid JSON.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "409":
          description: An account already uses this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: EMAIL_IN_USE
                  message: An account already uses this email.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: REQUEST_TOO_LARGE
                  message: The request body is too large.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "429":
          description: Too many requests. Try again in a minute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: RATE_LIMIT
                  message: Too many requests. Try again in a minute.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - email
                - password
            example:
              email: jamie@carry.test
              password: Enter the local test password
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Session"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  user:
                    id: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
                    name: Jamie Cruz
                    email: jamie@carry.test
                    role: customer
                  token: JWT returned by sign-in
                meta: {}
        "400":
          description: The request body must be valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: MALFORMED_JSON
                  message: The request body must be valid JSON.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "401":
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: INVALID_LOGIN
                  message: Email or password is incorrect.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: REQUEST_TOO_LARGE
                  message: The request body is too large.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "429":
          description: Too many requests. Try again in a minute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: RATE_LIMIT
                  message: Too many requests. Try again in a minute.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Read the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  id: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
                  name: Jamie Cruz
                  email: jamie@carry.test
                  role: customer
                meta: {}
        "401":
          description: Sign in to continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /categories:
    get:
      tags:
        - Catalog
      summary: List active bag categories
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  - id: totes
                    name: Totes
                    active: true
                meta: {}
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /products:
    get:
      tags:
        - Catalog
      summary: Browse, search and filter active bags
      security: []
      parameters:
        - in: query
          name: page
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 10000
          required: false
        - in: query
          name: limit
          schema:
            default: 12
            type: integer
            minimum: 1
            maximum: 50
          required: false
        - in: query
          name: q
          schema:
            default: ""
            type: string
            maxLength: 100
          required: false
        - in: query
          name: category
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          required: false
        - in: query
          name: minPrice
          schema:
            type: integer
            minimum: 0
            maximum: 10000000
          required: false
        - in: query
          name: maxPrice
          schema:
            type: integer
            minimum: 0
            maximum: 10000000
          required: false
        - in: query
          name: laptop
          schema:
            type: number
            minimum: 10
            maximum: 20
          required: false
          description: Laptop screen size in inches. Only bags with a rated compartment at least this size are
            returned.
        - in: query
          name: sort
          schema:
            default: featured
            type: string
            enum:
              - featured
              - newest
              - price-asc
              - price-desc
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  meta:
                    $ref: "#/components/schemas/Pagination"
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  - id: everyday-tote
                    name: The Everyday Tote
                    description: Room for your plans, big and small.
                    color: Caramel
                    image: /images/tote.svg
                    background: "#e9e2d7"
                    price_cents: 129900
                    stock: 8
                    laptop_inches: 14
                    monogram_cents: 15000
                    active: true
                    category: Totes
                    category_id: totes
                meta:
                  page: 1
                  limit: 12
                  total: 1
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /products/{id}:
    get:
      tags:
        - Catalog
      summary: Read one active bag
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: everyday-tote
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Product"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  id: everyday-tote
                  name: The Everyday Tote
                  description: Room for your plans, big and small.
                  color: Caramel
                  image: /images/tote.svg
                  background: "#e9e2d7"
                  price_cents: 129900
                  stock: 8
                  laptop_inches: 14
                  monogram_cents: 15000
                  active: true
                  category: Totes
                  category_id: totes
                meta: {}
        "404":
          description: This item could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: NOT_FOUND
                  message: This item could not be found.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /cart:
    get:
      tags:
        - Cart
      summary: Read the customer’s saved cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Cart"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  items:
                    - id: everyday-tote
                      name: The Everyday Tote
                      description: Room for your plans, big and small.
                      color: Caramel
                      image: /images/tote.svg
                      background: "#e9e2d7"
                      price_cents: 129900
                      stock: 8
                      laptop_inches: 14
                      monogram_cents: 15000
                      active: true
                      category: Totes
                      category_id: totes
                      quantity: 1
                      monogram: JM
                      available: true
                      unit_cents: 144900
                      line_cents: 144900
                  subtotal_cents: 144900
                  currency: PHP
                meta: {}
        "401":
          description: Sign in to continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
    patch:
      tags:
        - Cart
      summary: Add, change or remove a cart line
      description: A cart line is identified by productId and monogram. Use quantity zero with add false to
        remove it. Monograms have one to three letters and must be enabled on the bag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  maxLength: 64
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                monogram:
                  default: ""
                  type: string
                  pattern: ^[A-Z]{0,3}$
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 20
                add:
                  default: false
                  type: boolean
              required:
                - productId
                - quantity
            example:
              productId: everyday-tote
              quantity: 1
              monogram: JM
              add: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Cart"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  items:
                    - id: everyday-tote
                      name: The Everyday Tote
                      description: Room for your plans, big and small.
                      color: Caramel
                      image: /images/tote.svg
                      background: "#e9e2d7"
                      price_cents: 129900
                      stock: 8
                      laptop_inches: 14
                      monogram_cents: 15000
                      active: true
                      category: Totes
                      category_id: totes
                      quantity: 1
                      monogram: JM
                      available: true
                      unit_cents: 144900
                      line_cents: 144900
                  subtotal_cents: 144900
                  currency: PHP
                meta: {}
        "400":
          description: The request body must be valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: MALFORMED_JSON
                  message: The request body must be valid JSON.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "401":
          description: Sign in to continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "409":
          description: The total quantity exceeds available stock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: STOCK_CONFLICT
                  message: The total quantity exceeds available stock.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: REQUEST_TOO_LARGE
                  message: The request body is too large.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
  /checkout/quote:
    post:
      tags:
        - Checkout
      summary: Calculate a shipping and coupon quote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                couponCode:
                  default: ""
                  anyOf:
                    - type: string
                      pattern: ^[A-Z0-9-]{3,24}$
                    - type: string
                      const: ""
            example:
              couponCode: CARRY10
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Quote"
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  subtotal_cents: 144900
                  discount_cents: 14490
                  shipping_cents: 12000
                  total_cents: 142410
                  currency: PHP
                  items:
                    - id: everyday-tote
                      name: The Everyday Tote
                      description: Room for your plans, big and small.
                      color: Caramel
                      image: /images/tote.svg
                      background: "#e9e2d7"
                      price_cents: 129900
                      stock: 8
                      laptop_inches: 14
                      monogram_cents: 15000
                      active: true
                      category: Totes
                      category_id: totes
                      quantity: 1
                      monogram: JM
                      available: true
                      unit_cents: 144900
                      line_cents: 144900
                meta: {}
        "400":
          description: The request body must be valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: MALFORMED_JSON
                  message: The request body must be valid JSON.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "401":
          description: Sign in to continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "409":
          description: The request conflicts with the current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: CONFLICT
                  message: The request conflicts with the current state.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
