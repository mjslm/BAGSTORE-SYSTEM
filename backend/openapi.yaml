  /webhooks/maya:
    post:
      tags:
        - Payments
      summary: Accept a signed Maya payment event
      security: []
      parameters:
        - in: header
          name: X-Maya-Webhook-Timestamp
          required: true
          schema:
            type: string
          example: "1795341600000"
        - in: header
          name: X-Maya-Webhook-Signature
          required: true
          schema:
            type: string
          example: nonce=example,v1=SIGNATURE_FROM_MAYA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                requestReferenceNumber:
                  type: string
                paymentStatus:
                  type: string
                status:
                  type: string
                amount:
                  type:
                    - string
                    - number
                currency:
                  type: string
              required:
                - id
              additionalProperties: true
            example:
              id: 7f30701e-cd90-46c3-8961-723664f7b623
              requestReferenceNumber: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
              paymentStatus: PAYMENT_SUCCESS
              amount: 1424.1
              currency: PHP
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                      duplicate:
                        type: boolean
                      ignored:
                        type: boolean
                    required:
                      - accepted
                  meta:
                    type: object
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  accepted: true
                  duplicate: false
                meta: {}
        "400":
          description: The request body must be valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: MALFORMED_JSON
                  message: The request body must be valid JSON.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "401":
          description: Maya webhook verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: INVALID_WEBHOOK_SIGNATURE
                  message: Maya webhook verification failed.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: REQUEST_TOO_LARGE
                  message: The request body is too large.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "422":
          description: Check the indicated fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: VALIDATION
                  message: Check the indicated fields.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
        "500":
          description: Something went wrong. Try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: SERVER_ERROR
                  message: Something went wrong. Try again shortly.
                requestId: 4f6e5173-87d0-43fc-b36e-c0a15b04c654
